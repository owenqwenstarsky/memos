  <rect x="748" y="65" width="112" height="132" rx="13" transform="rotate(-9 748 65)" fill="#242424" stroke="#505050"/>
  <path d="M770 96L827 87M773 112L830 103M776 128L811 122" stroke="#919191" stroke-width="5" stroke-linecap="round"/>
