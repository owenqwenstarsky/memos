  <path d="M1015 181L1072 191M1012 198L1069 208M1009 215L1043 221" stroke="#919191" stroke-width="5" stroke-linecap="round"/>
  <rect x="856" y="103" width="151" height="179" rx="17" fill="#000000" fill-opacity=".35"/>
  <rect x="846" y="91" width="151" height="179" rx="17" fill="url(#note)"/>
  <path d="M873 128H932M873 149H963M873 170H963M873 191H921" stroke="#505050" stroke-width="7" stroke-linecap="round"/>
  <circle cx="966" cy="244" r="26" fill="#171717" stroke="#E0E0E0" stroke-width="3"/>
  <path d="M955 244H977M966 233V255" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round"/>
