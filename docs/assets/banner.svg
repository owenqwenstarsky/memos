<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Agent memos</title>
  <desc id="desc">Shared memory and skills for coding agents. Three connected notes represent knowledge shared across devices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080808"/><stop offset="1" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="note" x1="850" y1="100" x2="990" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F5F5"/><stop offset="1" stop-color="#BDBDBD"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#D0D0D0" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="980" cy="180" r="142" stroke="#BDBDBD" stroke-opacity=".10"/>
  <circle cx="980" cy="180" r="106" stroke="#BDBDBD" stroke-opacity=".08"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="166" fill="#FAFAFA" font-size="66" font-weight="700" letter-spacing="-2.5">Agent memos</text>
    <text x="64" y="215" fill="#BDBDBD" font-size="24">Give your agents a shared memory.</text>
    <text x="65" y="282" fill="#919191" font-size="14" letter-spacing="1">MARKDOWN</text>
    <circle cx="180" cy="277" r="2" fill="#BDBDBD"/>
    <text x="197" y="282" fill="#919191" font-size="14" letter-spacing="1">MCP</text>
    <circle cx="252" cy="277" r="2" fill="#BDBDBD"/>
    <text x="269" y="282" fill="#919191" font-size="14" letter-spacing="1">YOUR TAILNET</text>
  </g>
