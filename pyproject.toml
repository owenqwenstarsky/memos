[project]
name = "agent-memos"
version = "0.2.0"
description = "A local-first, auditable agent memory and skill service over MCP"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp[cli]>=1.12,<2", "fastembed>=0.7,<1", "numpy>=1.26", "PyYAML>=6,<7"]

[project.scripts]
memos = "memos.server:main"
memos-evaluate = "memos.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memos"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
