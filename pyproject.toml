[project]
name = "agent-memos"
version = "0.1.0"
description = "A shared Markdown memory library for agents over MCP and Tailscale"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp[cli]>=1.12,<2", "fastembed>=0.7,<1", "numpy>=1.26", "PyYAML>=6,<7"]

[project.scripts]
memos = "memos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memos"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
